name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Ensure Icons Exist
        run: |
          python make_icons.py

      - name: Build macOS App & DMG
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Ensure Icons Exist
        run: |
          python make_icons.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows App with PyInstaller
        run: |
          pyinstaller --clean pao_converter.spec

      - name: Compile Windows Installer with Inno Setup
        run: |
          $isccPaths = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "C:\ProgramData\chocolatey\bin\iscc.exe"
          )
          $iscc = $null
          foreach ($p in $isccPaths) {
              if (Test-Path $p) {
                  $iscc = $p
                  break
              }
          }
          if (-not $iscc) {
              $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
              if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
              Write-Error "ISCC.exe (Inno Setup Compiler) not found!"
              exit 1
          }
          Write-Host "Using Inno Setup Compiler at: $iscc"
          & "$iscc" installer.iss
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/*.exe

  create-release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            | Platform | File |
            |---|---|
            | macOS | `PaOConverter_vX.X.X_macOS.dmg` — drag app to Applications |
            | Windows | `PaOConverter_vX.X.X_Windows_Setup.exe` — run the installer |

            ### ⚠️ First-launch security warnings (expected for unsigned open-source apps)

            **macOS — Gatekeeper:** Run this once in Terminal after downloading:
            ```bash
            xattr -cr ~/Downloads/PaOConverter_*_macOS.dmg
            ```
            Or go to **System Settings → Privacy & Security → "Open Anyway"**

            **Windows — SmartScreen:** Click **More info → Run anyway**.
            Or right-click the `.exe` → **Properties → check Unblock → OK** before running.

            ---
            *Pa-O Converter is free and open-source (MIT License). No data is collected.*
